name: CI

on:
  schedule:
    - cron: "21 4 * * 1"
  push:
    branches: [main, develop, next]
  pull_request:
    branches: [main, develop, next]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.0
  HELM_VERSION: 4.2.4
  KIND_VERSION: v0.31.0
  KIND_NODE_IMAGE: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
  KUBECTL_VERSION: v1.35.8

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun ci

      - name: Audit dependencies
        run: bun run security:check

      - name: Lint code
        run: bun run lint

      - name: Run Knip
        run: bun run knip

      - name: Check Drizzle migrations
        run: bun run check:migrations

      - name: Type check with tsgo
        run: bun run typecheck

      - name: Run tests
        run: |
          set -euo pipefail
          (cd client && bun run test)
          (cd server && bun run test)

  validate-kubernetes:
    name: Validate Deployments
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: lint-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install dependencies
        run: bun ci

      - name: Create CI .env
        run: |
          cat > .env <<'EOF'
          SERVER_PORT=3000
          NODE_ENV=production
          LOG_LEVEL=info
          DB_PASSWORD=postgres
          DB_USER=postgres
          DB_HOST=db
          DB_PORT=5432
          DB_NAME=chatapp
          DB_URL=postgres://postgres:postgres@db:5432/chatapp
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_AUTH=redis_password
          REDIS_URL=redis://:redis_password@redis:6379
          OPENAI_API_KEY=test-openai-key
          SERPER_API_KEY=
          LANGFUSE_SECRET_KEY=
          LANGFUSE_PUBLIC_KEY=
          LANGFUSE_BASEURL=
          BETTER_AUTH_SECRET=test_secret_min_32_characters_long
          CLIENT_URL=http://localhost
          BASE_API_SLUG=api
          VITE_API_URL=/api
          VITE_DEV_MODE=false
          VITE_APP_NAME=Chat App
          VITE_APP_VERSION=1.0.0
          DOMAIN=localhost
          TRAEFIK_LOG_LEVEL=INFO
          EOF

      - name: Validate deployment manifests
        run: bun run check:deploy

      - name: Render Kubernetes manifests for schema validation
        run: |
          set -euo pipefail
          helm template chat-app helm/chat-app \
            --kube-version 1.36.4 \
            --set exposure.gateway.enabled=false \
            > .ci-rendered-manifests.yaml

      - name: Validate rendered Kubernetes schemas
        uses: docker://ghcr.io/yannh/kubeconform@sha256:461fae0fa54c5fe64028152533e57f6b88adb1d26dbafd80092e7310d349ae48 # v0.8.0-alpine
        with:
          entrypoint: /kubeconform
          args: >-
            -strict -summary -ignore-missing-schemas -kubernetes-version 1.36.0
            .ci-rendered-manifests.yaml

      - name: Create Kubernetes API validation cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: chat-app-validation
          kubectl_version: ${{ env.KUBECTL_VERSION }}
          node_image: ${{ env.KIND_NODE_IMAGE }}
          version: ${{ env.KIND_VERSION }}
          wait: 120s

      - name: Validate manifests against Kubernetes API server
        run: |
          set -euo pipefail
          helm template chat-app helm/chat-app \
            --kube-version 1.35.8 \
            --set exposure.gateway.enabled=false \
            | kubectl apply --dry-run=server --filename -

  build-client:
    name: Build Client
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun ci

      - name: Build client and report asset sizes
        run: cd client && bun run build:report

  build-server:
    name: Build Server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun ci

      - name: Build server bundle
        run: bun run build:server

  browser-e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun ci

      - name: Install Chromium
        run: bun run test:e2e:install

      - name: Run browser journeys
        run: bun run test:e2e

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results/playwright
          retention-days: 7

  docker:
    name: Docker Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [build-client, build-server, browser-e2e, validate-kubernetes]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Create CI .env
        run: |
          cat > .env <<'EOF'
          SERVER_PORT=3000
          NODE_ENV=production
          LOG_LEVEL=info
          DB_PASSWORD=postgres
          DB_USER=postgres
          DB_HOST=db
          DB_PORT=5432
          DB_NAME=chatapp
          DB_URL=postgres://postgres:postgres@db:5432/chatapp
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_AUTH=redis_password
          REDIS_URL=redis://:redis_password@redis:6379
          OPENAI_API_KEY=test-openai-key
          SERPER_API_KEY=
          LANGFUSE_SECRET_KEY=
          LANGFUSE_PUBLIC_KEY=
          LANGFUSE_BASEURL=
          BETTER_AUTH_SECRET=test_secret_min_32_characters_long
          CLIENT_URL=http://localhost
          BASE_API_SLUG=api
          VITE_API_URL=/api
          VITE_DEV_MODE=false
          VITE_APP_NAME=Chat App
          VITE_APP_VERSION=1.0.0
          DOMAIN=localhost
          TRAEFIK_LOG_LEVEL=INFO
          EOF

      - name: Detect DHI credentials
        id: dhi
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          set -euo pipefail
          if [ -n "${DOCKER_USERNAME:-}" ] && [ -n "${DOCKER_PASSWORD:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to DHI registry
        if: steps.dhi.outputs.enabled == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build server image (DHI)
        if: steps.dhi.outputs.enabled == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: server-prod
          pull: true
          load: true
          tags: chat-app-server:latest
          build-args: |
            BUN_VERSION=${{ env.BUN_VERSION }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      - name: Build client image (DHI)
        if: steps.dhi.outputs.enabled == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: client-prod
          pull: true
          load: true
          tags: chat-app-client:latest
          build-args: |
            BUN_VERSION=${{ env.BUN_VERSION }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,scope=client,mode=max

      - name: Build migrate image (DHI)
        if: steps.dhi.outputs.enabled == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: server/Dockerfile.migrate
          pull: true
          load: true
          tags: chat-app-migrate:latest
          build-args: |
            BUN_VERSION=${{ env.BUN_VERSION }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,scope=migrate,mode=max

      - name: Build server image (fallback)
        if: steps.dhi.outputs.enabled != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: server-prod
          pull: true
          load: true
          tags: chat-app-server:latest
          build-args: |
            BUN_DEV_IMAGE=oven/bun:${{ env.BUN_VERSION }}-alpine
            BUN_RUNTIME_IMAGE=oven/bun:${{ env.BUN_VERSION }}-alpine
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      - name: Build client image (fallback)
        if: steps.dhi.outputs.enabled != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: client-prod
          pull: true
          load: true
          tags: chat-app-client:latest
          build-args: |
            BUN_DEV_IMAGE=oven/bun:${{ env.BUN_VERSION }}-alpine
            NGINX_IMAGE=nginx:1.31.4-alpine3.24
          cache-from: type=gha,scope=client
          cache-to: type=gha,scope=client,mode=max

      - name: Build migrate image (fallback)
        if: steps.dhi.outputs.enabled != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: server/Dockerfile.migrate
          pull: true
          load: true
          tags: chat-app-migrate:latest
          build-args: |
            BUN_DEV_IMAGE=oven/bun:${{ env.BUN_VERSION }}-alpine
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,scope=migrate,mode=max

      - name: Validate Docker Compose
        run: |
          set -euo pipefail
          docker compose config --quiet
          echo "Docker Compose configuration is valid"
