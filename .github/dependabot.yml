version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
  # One Bun workspace update owns all manifests and the shared bun.lock.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      workspace-javascript:
        patterns:
          - "*"
  - package-ecosystem: docker
    directories:
      - /
      - /server
    schedule:
      interval: weekly
    groups:
      docker-images:
        patterns:
          - "*"
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns:
          - "*"
