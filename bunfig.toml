[install]
linker = "isolated"
# Hold newly published package versions for 72 hours before fresh resolution.
# Existing versions in bun.lock are unchanged by this gate.
minimumReleaseAge = "3d"
# Match the explicitly requested Bun 1.4.4 runtime; future type releases keep the hold.
minimumReleaseAgeExcludes = ["@types/bun@1.4.4", "bun-types@1.4.4"]
