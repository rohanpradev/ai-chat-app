{{- if and .Values.db.enabled .Values.db.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "chat-app.componentName" (dict "root" . "component" "db") }}-data
  labels:
    {{- include "chat-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: db
  {{- if .Values.db.persistence.retainOnDelete }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.db.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.db.persistence.size }}
  {{- if .Values.db.persistence.storageClassName }}
  storageClassName: {{ .Values.db.persistence.storageClassName }}
  {{- end }}
{{- end }}
{{- if and .Values.redis.enabled .Values.redis.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "chat-app.componentName" (dict "root" . "component" "redis") }}-data
  labels:
    {{- include "chat-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
  {{- if .Values.redis.persistence.retainOnDelete }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.redis.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.redis.persistence.size }}
  {{- if .Values.redis.persistence.storageClassName }}
  storageClassName: {{ .Values.redis.persistence.storageClassName }}
  {{- end }}
{{- end }}
